query PokemonOriginal {
    info: pokemonspecies_aggregate(where: {generation_id: {_eq: 1}}) {
        total: aggregate {
            count
        }
    }
    pokemon: pokemonspecies(where: {generation_id: {_eq: 1}}, order_by: {id: asc}) {
        id
        name
        description: pokemonspeciesflavortexts(where: {version_id: {_eq: 7}}) {
            flavorText: flavor_text
        }
        detail: pokemons {
            types: pokemontypes {
                type {
                    name
                }
            }
            stats: pokemonstats {
                stat {
                    id
                    name
                }
                baseStat: base_stat
            }
            height
            weight
            moves: pokemonmoves(where: {move_learn_method_id: {_eq: 1}, version_group_id: {_eq: 7}}, order_by: {level: asc}) {
                level
                id: move_id
            }
        }
        genderRate: gender_rate
        evolutionChain: evolutionchain {
            evolutions: pokemonspecies(order_by: {id: asc_nulls_first}) {
                id
                targetLevels: pokemonevolutions {
                    level: min_level
                    triggerType: evolution_trigger_id
                    itemId: evolution_item_id
                }
            }
        }
        species: pokemonspeciesnames(where: {language: {iso639: {_eq: "en"}}}) {
            genus
        }
    }
}
